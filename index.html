<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>eaze — Wellness Buddy Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;cursor:default}
  :root{
    --bg:#09091A; --surf:#12122A; --surf2:#1B1B36;
    --brand:#FF5722; --btn:#FF9E44; --bt:#1A1A1A;
    --mu:rgba(255,255,255,.45);
    --good:#4FC79A; --warn:#F4B740; --bad:#FF6B81; --info:#5AB6F0;
  }
  html,body{height:100%}
  body{
    font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#fff;letter-spacing:-.01em;
    background:radial-gradient(ellipse 90% 45% at 15% 0%,rgba(255,87,34,.17) 0%,transparent 68%),var(--bg);
    background-attachment:fixed;
  }
  .wrap{max-width:430px;margin:0 auto;padding:20px 16px 40px;min-height:100%}
  .hide{display:none!important}

  /* ── login ── */
  .login{display:flex;flex-direction:column;justify-content:center;min-height:100vh;gap:0}
  .login img{height:28px;width:auto;align-self:center;object-fit:contain;margin-bottom:26px}
  .login h1{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
  .login p{font-size:13.5px;color:var(--mu);margin-top:9px;line-height:1.5;font-weight:500}
  .field{margin-top:26px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);font-weight:800;margin-bottom:9px}
  .inputrow{display:flex;align-items:center;gap:10px;background:var(--surf);border:1.5px solid rgba(255,255,255,.1);border-radius:14px;padding:0 14px}
  .inputrow:focus-within{border-color:var(--btn)}
  .inputrow span{font-size:15px;font-weight:700;color:var(--mu)}
  .inputrow input{flex:1;background:none;border:0;outline:none;color:#fff;font-family:inherit;font-size:17px;font-weight:700;padding:15px 0;letter-spacing:.02em}
  .inputrow input::placeholder{color:rgba(255,255,255,.2);font-weight:600}
  .btn{width:100%;margin-top:16px;background:var(--btn);color:var(--bt);border:0;border-radius:14px;padding:16px;font-family:inherit;font-size:15px;font-weight:800}
  .btn:disabled{opacity:.55}
  .err{margin-top:14px;font-size:13px;color:var(--bad);font-weight:600;line-height:1.45}

  /* ── header ── */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .brand{display:flex;flex-direction:column;gap:6px}
  .brand img{height:22px;width:auto}
  .greet{font-size:12px;color:var(--mu);font-weight:500}
  .greet b{color:#fff;font-weight:800}
  .out{background:var(--surf2);border:0;color:var(--mu);font-size:11px;font-weight:700;padding:7px 12px;border-radius:9px;font-family:inherit}

  /* ── inactive banner ── */
  .offcard{background:rgba(90,182,240,.08);border:1.5px solid rgba(90,182,240,.25);border-radius:16px;padding:17px;margin-bottom:16px}
  .offt{font-size:15px;font-weight:800;line-height:1.3}
  .offb{font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.5;margin-top:6px;font-weight:500}

  /* ── earning tier ── */
  .hero{border-radius:18px;padding:17px;margin-bottom:16px;background:linear-gradient(160deg,rgba(255,158,68,.15),rgba(255,87,34,.04));border:1.5px solid rgba(255,158,68,.28)}
  .hh{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
  .hprog{font-size:11.5px;color:rgba(255,255,255,.65);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .chip{font-size:11px;font-weight:600;background:var(--surf2);padding:6px 11px;border-radius:9px;color:rgba(255,255,255,.82);white-space:nowrap}
  .trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .tname{font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1}
  .tbadge{background:var(--btn);color:var(--bt);font-weight:800;font-size:13px;padding:7px 12px;border-radius:11px;white-space:nowrap}

  .ladder{display:flex;gap:3px;height:34px;margin:17px 0 0}
  .seg{border-radius:7px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .seg.cur{background:linear-gradient(180deg,rgba(255,158,68,.55),rgba(255,122,46,.45));box-shadow:inset 0 0 0 1.5px rgba(255,158,68,1)}
  .seglbl{font-size:10px;font-weight:800;color:rgba(255,255,255,.45);white-space:nowrap}
  .seg.cur .seglbl{color:#fff}

  .sig{margin-top:18px;background:rgba(0,0,0,.22);border-radius:12px;padding:13px}
  .sigh{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.55);font-weight:800;margin-bottom:11px}
  .sigrow{display:flex;align-items:center;gap:9px;padding:6px 0}
  .sigic{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;flex-shrink:0;font-size:10px;font-weight:900}
  .sigt{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85);flex:1}
  .sigl{font-size:11px;font-weight:700;color:var(--warn)}
  .sigmore{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;padding:8px 0 2px;margin-top:4px;border-top:1px solid rgba(255,255,255,.07);font-family:inherit;color:inherit;text-align:left}
  .sigmore .sigt{color:rgba(255,255,255,.5);font-weight:600}
  .sigchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .sigchip{font-size:11px;font-weight:600;color:rgba(255,255,255,.6);background:rgba(255,255,255,.05);border-radius:7px;padding:5px 9px}

  .crsec{margin-bottom:9px}
  .crsec:last-child{margin-bottom:0}
  .crsec-h{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.72);margin-bottom:10px}
  .nudge{margin-top:13px;font-size:12.5px;font-weight:700;color:var(--btn);line-height:1.4}
  .lock{font-size:11px;color:rgba(255,255,255,.36);margin-top:10px;font-weight:500;line-height:1.4}

  /* ── sections ── */
  .sech{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.42);font-weight:800;margin:0 2px 9px;display:flex;align-items:center;justify-content:space-between}
  .sech .hint{text-transform:none;letter-spacing:0;font-weight:600;color:rgba(255,255,255,.28);font-size:10px}

  .card{background:var(--surf);border:1.5px solid rgba(255,255,255,.09);border-radius:16px;padding:16px;width:100%;text-align:left;font-family:inherit;color:inherit;margin-bottom:9px;display:block}
  .card.open{background:var(--surf2)}
  .crhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
  .crtitle{font-size:13px;font-weight:800;letter-spacing:.02em}
  .caret{opacity:.4;font-size:11px}
  .crstats{display:flex;gap:8px;margin-bottom:13px}
  .crstat{flex:1;background:rgba(255,255,255,.03);border-radius:12px;padding:11px 9px;text-align:center}
  .crstat-val{font-size:23px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .crstat-ttl{font-size:9.5px;color:rgba(255,255,255,.45);font-weight:600;margin-top:5px;line-height:1.2}
  .splitbar{display:flex;gap:2px;height:8px;border-radius:5px;overflow:hidden}

  .hhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .htitle{font-size:13px;font-weight:800}
  .htotal{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .haudio{font-size:11px;font-weight:700;color:var(--btn);margin-top:5px;text-align:right}
  .hbar{height:11px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;margin:13px 0 10px;display:flex}
  .hbar-audio{background:linear-gradient(90deg,#FF9E44,#FF7A2E);border-radius:6px}
  .hsplit{display:flex;gap:16px}
  .hsplit-item{display:flex;align-items:center;gap:6px}
  .hsq{width:8px;height:8px;border-radius:2px}
  .hsplit-val{font-size:12.5px;font-weight:800}
  .hsplit-ttl{font-size:11px;color:rgba(255,255,255,.42);font-weight:600}

  .panel{background:var(--surf);border:1.5px solid rgba(255,255,255,.1);border-radius:15px;padding:14px;margin-top:-2px;margin-bottom:9px}
  .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
  .ptitle{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.5);font-weight:800}

  .daybars{display:flex;gap:2px}
  .dcol{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0}
  .dval{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.85);line-height:1}
  .dval.off{color:rgba(255,255,255,.25)}
  .dsub{font-size:9px;font-weight:700;color:var(--btn);line-height:1;margin-top:-2px}
  .dtrack{width:100%;height:50px;display:flex;align-items:flex-end;justify-content:center}
  .dfill{width:70%;border-radius:3px 3px 0 0}
  .stack{width:70%;display:flex;flex-direction:column;justify-content:flex-end;border-radius:3px 3px 0 0;overflow:hidden}
  .nest{width:70%;background:rgba(255,255,255,.16);border-radius:3px 3px 0 0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .nest-audio{width:100%;background:linear-gradient(180deg,#FF9E44,#FF7A2E)}
  .dempty{width:70%;height:50px;border:1.5px dashed rgba(255,255,255,.13);border-radius:4px}
  .ddate{font-size:8.5px;color:rgba(255,255,255,.35);font-weight:600;white-space:nowrap}
  .ddate.off{color:rgba(255,255,255,.2)}

  .cqcard{background:var(--surf);border:1.5px solid rgba(255,255,255,.09);border-radius:15px;padding:15px}
  .sub{margin-bottom:16px}
  .sub:last-child{margin-bottom:0}
  .subt{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.72);margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .sdot{width:6px;height:6px;border-radius:50%}
  .subval{margin-left:auto;font-weight:800;color:#fff}

  .fresh{display:flex;align-items:flex-start;gap:8px;background:rgba(90,182,240,.07);border:1px solid rgba(90,182,240,.18);border-radius:12px;padding:10px 12px;margin-bottom:11px}
  .fresh-ic{font-size:11px;line-height:1.45;color:var(--info);font-weight:900;flex-shrink:0}
  .fresh-t{font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.6);font-weight:500}
  .fresh-t b{color:rgba(255,255,255,.9);font-weight:700}

  .dlt{font-size:10px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
  .dlt.up{color:var(--good)} .dlt.down{color:var(--bad)} .dlt.flat{color:rgba(255,255,255,.3)}

  /* signals shown outside the tier block, for buddies with no tier on show */
  .work{background:var(--surf);border:1.5px solid rgba(255,255,255,.09);border-radius:16px;padding:16px;margin-bottom:16px}
  .work .sigh{margin-bottom:12px}
  .work .sigmore{border-top-color:rgba(255,255,255,.08)}
  .worknote{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.07);
    font-size:11.5px;line-height:1.5;color:rgba(255,255,255,.45);font-weight:500}

  .ret{background:var(--surf);border:1.5px solid rgba(255,255,255,.09);border-radius:16px;padding:16px;width:100%;
    text-align:left;font-family:inherit;color:inherit;display:block;margin-top:9px}
  .ret-h{display:flex;align-items:center;justify-content:space-between}
  .ret-t{font-size:13px;font-weight:800}
  .ret-sub{font-size:10.5px;color:rgba(255,255,255,.38);font-weight:600;margin-top:3px}
  .ret-v{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .ret-x{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);
    font-size:12px;line-height:1.5;color:rgba(255,255,255,.62);font-weight:500}

  .legend{display:flex;align-items:center;gap:7px;font-size:10px;color:rgba(255,255,255,.3);margin-top:12px;font-weight:500}
  .legbox{width:13px;height:11px;border:1.5px dashed rgba(255,255,255,.2);border-radius:3px;flex-shrink:0}
  .foot{text-align:center;font-size:10.5px;color:rgba(255,255,255,.33);margin-top:22px;line-height:1.5;font-weight:500}
  /* ── loading ── */
  .spin{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
  .ld-top{display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:34px}
  .ld-logo{height:26px;width:auto;object-fit:contain;animation:breathe 2.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.35;transform:scale(.985)}50%{opacity:1;transform:scale(1)}}
  .ld-msg{font-size:13px;font-weight:700;color:rgba(255,255,255,.72);letter-spacing:-.01em;min-height:18px}
  .ld-track{width:132px;height:3px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden}
  .ld-fill{height:100%;width:42%;border-radius:2px;background:linear-gradient(90deg,#FF9E44,#FF5722);animation:slide 1.25s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-115%)}100%{transform:translateX(275%)}}

  /* skeleton mirrors the real layout so nothing jumps when data lands */
  .sk{border-radius:16px;background:var(--surf);border:1.5px solid rgba(255,255,255,.07);padding:16px;margin-bottom:9px}
  .sk-hero{border-radius:18px;padding:17px;margin-bottom:16px;background:linear-gradient(160deg,rgba(255,158,68,.09),rgba(255,87,34,.03));border:1.5px solid rgba(255,158,68,.16)}
  .shim{background:rgba(255,255,255,.07);border-radius:6px;position:relative;overflow:hidden}
  .shim::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:shimmer 1.5s infinite}
  @keyframes shimmer{100%{transform:translateX(100%)}}
  .sk-row{display:flex;gap:8px;margin-top:13px}
  .sk-row>div{flex:1;height:52px;border-radius:12px}
  @media (prefers-reduced-motion:reduce){
    .ld-logo,.ld-fill,.shim::after{animation:none}
    .ld-logo{opacity:1}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ── Login ── -->
  <section id="login" class="login">
    <img id="loginLogo" alt="eaze">
    <p>Sign in with the mobile number registered with eaze to see how you're doing.</p>
    <div class="field">
      <label for="mobile">Mobile number</label>
      <div class="inputrow">
        <span>+91</span>
        <input id="mobile" type="tel" inputmode="numeric" autocomplete="tel"
               maxlength="10" placeholder="10-digit number">
      </div>
      <button class="btn" id="loginBtn">Login</button>
      <div class="err hide" id="loginErr"></div>
    </div>
  </section>

  <!-- ── Dashboard ── -->
  <section id="app" class="hide"></section>
  <section id="loading" class="spin hide">
    <div class="ld-top">
      <img class="ld-logo" id="ldLogo" alt="eaze">
      <div class="ld-msg" id="ldMsg">Fetching your details</div>
      <div class="ld-track"><div class="ld-fill"></div></div>
    </div>
    <div class="sk sk-hero">
      <div class="shim" style="width:96px;height:11px"></div>
      <div class="shim" style="width:132px;height:30px;margin-top:14px"></div>
      <div class="shim" style="width:100%;height:34px;margin-top:17px;border-radius:7px"></div>
    </div>
    <div class="sk">
      <div class="shim" style="width:104px;height:12px"></div>
      <div class="sk-row"><div class="shim"></div><div class="shim"></div><div class="shim"></div></div>
      <div class="shim" style="width:100%;height:8px;margin-top:13px"></div>
    </div>
    <div class="sk">
      <div class="shim" style="width:88px;height:12px"></div>
      <div class="shim" style="width:100%;height:11px;margin-top:14px"></div>
    </div>
  </section>
</div>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h1 = (n) => (n === null || n === undefined) ? '–' : Number(n).toFixed(1);
const pct = (n) => (n === null || n === undefined) ? '–' : Math.round(Number(n)) + '%';

let DATA = null;
let openPanel = null;
let sigOpen = false;
let retOpen = false;
let CONFIG = { mobileLogin: true, urlLogin: false };
let msgTimer = null;

// ── Loading screen ────────────────────────────────────────────────────────────
const LOAD_MSGS = ['Fetching your details', 'Pulling your last 7 days', 'Almost there'];

function showLoading() {
  $('login').classList.add('hide');
  $('app').classList.add('hide');
  $('loading').classList.remove('hide');

  let i = 0;
  $('ldMsg').textContent = LOAD_MSGS[0];
  clearInterval(msgTimer);
  // Cycles rather than sitting on one line, so a slow Redash poll still looks
  // like progress instead of a hang.
  msgTimer = setInterval(() => {
    i = (i + 1) % LOAD_MSGS.length;
    $('ldMsg').textContent = LOAD_MSGS[i];
  }, 1800);
}

function hideLoading() {
  clearInterval(msgTimer);
  msgTimer = null;
  $('loading').classList.add('hide');
}

// ── Auth ──────────────────────────────────────────────────────────────────────
$('mobile').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
  $('loginErr').classList.add('hide');
});
$('mobile').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('loginBtn').addEventListener('click', login);

async function login() {
  const mobileNumber = $('mobile').value.trim();
  if (mobileNumber.length !== 10) return showLoginError('Enter your 10-digit mobile number.');

  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'Checking…';
  try {
    const res  = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mobileNumber }), credentials: 'same-origin',
    });
    const body = await res.json();
    if (!res.ok) return showLoginError(body.error || 'Could not sign you in.');
    await loadDashboard();
  } catch {
    showLoginError('Network problem. Please try again.');
  } finally {
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = 'Login';
  }
}

function showLoginError(msg) {
  $('loginErr').textContent = msg;
  $('loginErr').classList.remove('hide');
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
  DATA = null;
  $('app').classList.add('hide');
  $('login').classList.remove('hide');
  $('mobile').value = '';
}

async function loadDashboard() {
  showLoading();
  try {
    const res = await fetch('/api/me/dashboard', { credentials: 'same-origin' });
    if (res.status === 401) { hideLoading(); showEntryScreen(); return; }
    DATA = await res.json();
    hideLoading();
    render();
  } catch {
    hideLoading();
    showEntryScreen('Could not load your numbers. Please try again.');
  }
}

/**
 * Entry routing. A uid in the URL wins when link sign-in is enabled; otherwise
 * we fall back to the mobile form. If neither path is open the expert is told
 * plainly rather than shown a form that cannot work.
 */
function showEntryScreen(msg) {
  $('loading').classList.add('hide');
  $('app').classList.add('hide');
  $('login').classList.remove('hide');

  if (!CONFIG.mobileLogin) {
    $('login').innerHTML =
      `<img src="${LOGO}" alt="eaze" style="height:28px;width:auto;align-self:center;margin-bottom:26px">
       <p style="text-align:center">Open your dashboard from the eaze app to continue.</p>`;
    return;
  }
  if (msg) showLoginError(msg);
}

function readUidFromUrl() {
  try {
    const p = new URLSearchParams(window.location.search);
    return p.get('uid') || p.get('user_id') || '';
  } catch { return ''; }
}

function stripUidFromUrl() {
  try {
    const url = new URL(window.location.href);
    url.searchParams.delete('uid');
    url.searchParams.delete('user_id');
    window.history.replaceState({}, '', url.pathname + url.search + url.hash);
  } catch { /* non-fatal */ }
}

async function boot() {
  showLoading();
  try {
    CONFIG = await (await fetch('/api/config', { credentials: 'same-origin' })).json();
  } catch { /* keep defaults */ }

  const uid = readUidFromUrl();
  if (uid && CONFIG.urlLogin) {
    try {
      const res = await fetch('/api/auth/url', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid }), credentials: 'same-origin',
      });
      // Clear the token either way so a back/refresh can't replay a bad one.
      stripUidFromUrl();
      if (res.ok) return loadDashboard();
      const body = await res.json().catch(() => ({}));
      hideLoading();
      return showEntryScreen(body.error || 'That link didn\u2019t work.');
    } catch {
      stripUidFromUrl();
      hideLoading();
      return showEntryScreen('Network problem. Please try again.');
    }
  }

  // No token: resume an existing session, falling back to the entry screen.
  return loadDashboard();
}

/**
 * Week-over-week chip. `goodDir` says which way is an improvement, so a drop
 * in rejections reads green while a drop in pickup reads red.
 */
function deltaChip(d, goodDir) {
  if (d === null || d === undefined) return '';
  const r = Math.round(d * 10) / 10;
  if (Math.abs(r) < 0.5) return `<div class="dlt flat">no change</div>`;
  const better = goodDir === 'higher' ? r > 0 : r < 0;
  const arrow  = r > 0 ? '\u25B2' : '\u25BC';
  return `<div class="dlt ${better ? 'up' : 'down'}">${arrow} ${Math.abs(r)} pts</div>`;
}

// ── Chart builders ────────────────────────────────────────────────────────────
function dayBars(values, unit, dirGood, labels, target) {
  const nums = values.filter(v => v !== null && v !== undefined);
  const max  = Math.max(...nums, target || 0) * 1.2 || 1;
  const good = (v) => dirGood === 'higher' ? v >= (target || 0) : v <= (target === undefined ? Infinity : target);
  return `<div class="daybars">` + values.map((v, i) => {
    const off = v === null || v === undefined;
    const hgt = off ? 0 : Math.max(Math.round((v / max) * 50), 3);
    return `<div class="dcol">
      <div class="dval${off ? ' off' : ''}">${off ? '–' : esc(v) + unit}</div>
      <div class="dtrack">${off
        ? '<div class="dempty"></div>'
        : `<div class="dfill" style="height:${hgt}px;background:${good(v) ? 'rgba(79,199,154,.85)' : 'rgba(244,183,64,.85)'}"></div>`}</div>
      <div class="ddate${off ? ' off' : ''}">${esc(labels[i] || '')}</div>
    </div>`;
  }).join('') + `</div>`;
}

function nestedHourBars(total, audio, labels) {
  const max = Math.max(...total.filter(v => v != null), 1) * 1.2;
  return `<div class="daybars">` + total.map((t, i) => {
    const off = t === null || t === undefined;
    const ht  = off ? 0 : Math.max(Math.round((t / max) * 50), 3);
    const ha  = off ? 0 : Math.round(((audio[i] || 0) / max) * 50);
    return `<div class="dcol">
      <div class="dval${off ? ' off' : ''}">${off ? '–' : h1(t) + 'h'}</div>
      <div class="dsub">${off ? '' : h1(audio[i]) + 'h'}</div>
      <div class="dtrack">${off
        ? '<div class="dempty"></div>'
        : `<div class="nest" style="height:${ht}px"><div class="nest-audio" style="height:${ha}px"></div></div>`}</div>
      <div class="ddate${off ? ' off' : ''}">${esc(labels[i] || '')}</div>
    </div>`;
  }).join('') + `</div>`;
}

function colorBars(values, labels, color) {
  const nums = values.filter(v => v !== null && v !== undefined);
  const max  = Math.max(...nums, 1) * 1.2;
  return `<div class="daybars">` + values.map((v, i) => {
    const off = v === null || v === undefined;
    const hgt = off ? 0 : Math.max(Math.round((v / max) * 50), 3);
    return `<div class="dcol">
      <div class="dval${off ? ' off' : ''}">${off ? '–' : Math.round(v) + '%'}</div>
      <div class="dtrack">${off
        ? '<div class="dempty"></div>'
        : `<div class="dfill" style="height:${hgt}px;background:${color}"></div>`}</div>
      <div class="ddate${off ? ' off' : ''}">${esc(labels[i] || '')}</div>
    </div>`;
  }).join('') + `</div>`;
}

function stackedDays(daily, labels) {
  return `<div class="daybars">` + labels.map((l, i) => {
    const p = daily.pickup[i], r = daily.rejected[i], n = daily.dnp[i];
    const off = p === null || p === undefined;
    return `<div class="dcol">
      <div class="dval${off ? ' off' : ''}">${off ? '–' : Math.round(p) + '%'}</div>
      <div class="dtrack">${off ? '<div class="dempty"></div>' : `<div class="stack">
        <div style="height:${(n || 0) * .5}px;background:var(--bad)"></div>
        <div style="height:${(r || 0) * .5}px;background:var(--warn)"></div>
        <div style="height:${p * .5}px;background:var(--good)"></div>
      </div>`}</div>
      <div class="ddate${off ? ' off' : ''}">${esc(l)}</div>
    </div>`;
  }).join('') + `</div>`;
}

// ── Render ────────────────────────────────────────────────────────────────────
function resetText(r) {
  if (r.hoursToReset != null && r.hoursToReset < 24) {
    const h = Math.max(1, Math.round(r.hoursToReset));
    return `resets in ${h} hour${h === 1 ? '' : 's'}`;
  }
  const d = r.daysToReset;
  if (d == null) return 'resets weekly';
  return `resets in ${d} day${d === 1 ? '' : 's'}`;
}

function render() {
  const d = DATA;
  $('loading').classList.add('hide');
  $('app').classList.remove('hide');

  const et = d.earningTier;
  const labels = d.window.labels || [];
  const active = d.activity.hasActivity;

  const ladder = `<div class="ladder">
    ${et.segments.map(s => `<div class="seg${s.name === et.tier ? ' cur' : ''}" style="width:${s.w}%">
        <span class="seglbl">${esc(s.label)}</span></div>`).join('')}
  </div>`;

  const allSig = et.signals || [];
  const needsWork = allSig.filter(s => s.signal === 'needs_work');
  const onTrack   = allSig.filter(s => s.signal !== 'needs_work');

  const signalBody = (heading) => allSig.length ? `
      <div class="sigh">${heading}</div>
      ${needsWork.map(s => `<div class="sigrow">
          <span class="sigic" style="background:rgba(244,183,64,.18);color:var(--warn)">!</span>
          <span class="sigt">${esc(s.title)}</span>
          <span class="sigl">Needs work</span>
        </div>`).join('')}
      ${onTrack.length ? `
        <button class="sigmore" onclick="toggleSig()">
          <span class="sigic" style="background:rgba(79,199,154,.18);color:var(--good)">✓</span>
          <span class="sigt">${needsWork.length
            ? `${onTrack.length} other${onTrack.length === 1 ? '' : 's'} on track`
            : `All ${onTrack.length} on track`}</span>
          <span class="caret">${sigOpen ? '▲' : '▼'}</span>
        </button>
        ${sigOpen ? `<div class="sigchips">${onTrack.map(s =>
          `<span class="sigchip">${esc(s.title)}</span>`).join('')}</div>` : ''}
      ` : ''}` : '';

  // Inside the tier block when a tier is on show...
  const signals = signalBody("What's shaping your tier")
    ? `<div class="sig">${signalBody("What's shaping your tier")}</div>` : '';

  // ...and as its own card, reframed, when it isn't. Same data, no mention of
  // a tier the buddy hasn't reached — this reads as a to-do list, not a rank.
  const workCard = signalBody('What to work on')
    ? `<div class="work">${signalBody('What to work on')}</div>` : '';

  const cr = d.callResponse;
  const responseCard = `
    <button class="card${openPanel === 'cr' ? ' open' : ''}" onclick="toggle('cr')">
      <div class="crhead"><span class="crtitle">Call Response</span><span class="caret">▼</span></div>
      <div class="crstats">
        <div class="crstat"><div class="crstat-val" style="color:var(--good)">${pct(cr.pickupPct)}</div><div class="crstat-ttl">Picked up</div>${deltaChip(cr.pickupDelta, 'higher')}</div>
        <div class="crstat"><div class="crstat-val" style="color:var(--warn)">${pct(cr.rejectedPct)}</div><div class="crstat-ttl">Rejected</div>${deltaChip(cr.rejectedDelta, 'lower')}</div>
        <div class="crstat"><div class="crstat-val" style="color:var(--bad)">${pct(cr.dnpPct)}</div><div class="crstat-ttl">Did not pick</div>${deltaChip(cr.dnpDelta, 'lower')}</div>
      </div>
      <div class="splitbar">
        <div style="width:${cr.pickupPct || 0}%;background:var(--good)"></div>
        <div style="width:${cr.rejectedPct || 0}%;background:var(--warn)"></div>
        <div style="width:${cr.dnpPct || 0}%;background:var(--bad)"></div>
      </div>
    </button>
    ${openPanel === 'cr' ? [
      { t: 'Picked up',    v: cr.pickupPct,   d: cr.daily.pickup,   c: 'var(--good)' },
      { t: 'Rejected',     v: cr.rejectedPct, d: cr.daily.rejected, c: 'var(--warn)' },
      { t: 'Did not pick', v: cr.dnpPct,      d: cr.daily.dnp,      c: 'var(--bad)'  },
    ].map(m => `<div class="panel">
      <div class="crsec-h">
        <span class="sdot" style="background:${m.c}"></span>${m.t}
        <span class="subval" style="color:${m.c}">${pct(m.v)}</span>
      </div>
      ${colorBars(m.d, labels, m.c)}
    </div>`).join('') + `<div class="legend" style="margin:-2px 2px 9px">
      <span class="legbox"></span>Empty bars are days you weren't active</div>` : ''}`;

  const hr = d.hours;
  const hoursCard = `
    <button class="card${openPanel === 'h' ? ' open' : ''}" onclick="toggle('h')">
      <div class="hhead">
        <span class="htitle">Active Hours</span>
        <div style="display:flex;align-items:flex-end;gap:10px">
          <div><div class="htotal">${h1(hr.total)}h</div><div class="haudio">${h1(hr.audio)}h audio</div></div>
          <span class="caret">▼</span>
        </div>
      </div>
      <div class="hbar"><div class="hbar-audio" style="width:${hr.total ? (hr.audio / hr.total) * 100 : 0}%"></div></div>
      <div class="hsplit">
        <div class="hsplit-item"><span class="hsq" style="background:var(--btn)"></span>
          <span class="hsplit-val" style="color:var(--btn)">${h1(hr.audio)}h</span><span class="hsplit-ttl">Audio</span></div>
        <div class="hsplit-item"><span class="hsq" style="background:rgba(255,255,255,.15)"></span>
          <span class="hsplit-val" style="color:rgba(255,255,255,.75)">${h1(hr.total)}h</span><span class="hsplit-ttl">Total</span></div>
      </div>
    </button>
    ${openPanel === 'h' ? `<div class="panel">
      <div class="phead"><span class="ptitle">Active Hours</span></div>
      ${nestedHourBars(hr.dailyTotal, hr.dailyAudio, labels)}
      <div class="hsplit" style="margin-top:13px">
        <div class="hsplit-item"><span class="hsq" style="background:var(--btn)"></span><span class="hsplit-ttl">Audio</span></div>
        <div class="hsplit-item"><span class="hsq" style="background:rgba(255,255,255,.16)"></span><span class="hsplit-ttl">Total</span></div>
      </div>
      <div class="legend"><span class="legbox"></span>Empty bars are days you weren't active</div>
    </div>` : ''}`;

  const ret = d.retention || {};
  const retentionCard = (active && ret.pct != null) ? `
    <div class="sech" style="margin-top:20px"><span>Repeat Callers</span></div>
    <button class="ret" onclick="toggleRet()">
      <div class="ret-h">
        <div>
          <div class="ret-t">Repeat Callers</div>
          <div class="ret-sub">3-day retention</div>
        </div>
        <div class="ret-v" style="color:var(--btn)">${pct(ret.pct)}</div>
      </div>
      ${retOpen ? `<div class="ret-x"><b style="color:var(--btn)">People come back when a call goes well.
        That's what lifts this.</b></div>` : ''}
    </button>` : '';

  const dots = ['var(--good)', 'var(--info)', 'var(--bad)'];
  const quality = `<div class="sech" style="margin-top:20px"><span>Call Quality</span></div>
    <div class="cqcard">
      ${d.callQuality.subMetrics.map((sm, i) => `<div class="sub">
        <div class="subt"><span class="sdot" style="background:${dots[i]}"></span>${esc(sm.title)}
          <span class="subval">${sm.value == null ? '–' : esc(sm.value) + sm.unit}</span></div>
        ${sm.delta != null ? `<div style="margin:-4px 0 8px 13px">${deltaChip(sm.delta, sm.directionGood)}</div>` : ''}
        ${dayBars(sm.values, sm.unit, sm.directionGood, labels, undefined)}
      </div>`).join('')}
      <div class="legend"><span class="legbox"></span>Empty bars are days you weren't active</div>
    </div>`;

  $('app').innerHTML = `
    <div class="top">
      <div class="brand"><img src="${LOGO}" alt="eaze">
        <span class="greet">Hi&nbsp;<b>${esc(d.expert.name || 'there')}</b></span></div>
      <button class="out" onclick="logout()">Sign out</button>
    </div>

    ${!active ? `<div class="offcard">
      <div class="offt">No activity in the last 7 full days</div>
      <div class="offb">We don't have any calls or online time to show for ${esc(d.window.startLabel || '')} – ${esc(d.window.endLabel || '')}. If you've been online today, it'll appear here tomorrow.</div>
    </div>` : ''}

    ${et.showTier ? `<div class="hero">
      <div class="hh"><span class="hprog">Earning Tier</span>
        <span class="chip">${esc(resetText(d.reset))}</span></div>
      <div class="trow">
        <div class="tname">${esc(et.tier)}</div>
        ${et.topPercent != null ? `<span class="tbadge">Top ${esc(et.topPercent)}%</span>` : ''}
      </div>
      ${ladder}
      ${active ? signals : ''}
      ${active && et.nudge ? `<div class="nudge">→ ${esc(et.nudge)}</div>` : ''}
      <div class="lock">Your tier resets and is recalculated when the phase ends</div>
    </div>` : (active ? workCard : '')}

    ${active ? `
      <div class="sech"><span>Where you stand</span><span class="hint">Tap for daily view</span></div>
      <div class="fresh">
        <span class="fresh-ic">i</span>
        <span class="fresh-t">Last 7 full days, up to <b>${esc(d.window.endLabel || '')}</b>. Today's calls and hours are still being counted — they'll show up here tomorrow.</span>
      </div>
      ${responseCard}
      ${hoursCard}
      ${quality}
      ${retentionCard}
      <div class="foot">Updated once a day · complete days only</div>
    ` : ''}`;
}

function toggle(key) {
  openPanel = openPanel === key ? null : key;
  render();
}

function toggleSig() {
  sigOpen = !sigOpen;
  render();
}

function toggleRet() {
  retOpen = !retOpen;
  render();
}

boot();
</script>
</body>
</html>
